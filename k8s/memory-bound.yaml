apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-bound
  labels:
    app.kubernetes.io/name: memory-bound
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-bound
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-bound
    spec:
      containers:
        - name: memory-bound
          image: pittersss/memory-bound:1.0.0
          ports:
            - name: http
              containerPort: 8080
          env:
            # O Dockerfile não define o heap; sem isso a JVM usa só 25% do limite do container
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: memory-bound
  labels:
    app.kubernetes.io/name: memory-bound
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: memory-bound
  ports:
    - name: http
      port: 8080
      targetPort: http
      # Publicada na VM pelo `minikube start --ports`; o Load Balancer aponta para ela
      nodePort: 30083
