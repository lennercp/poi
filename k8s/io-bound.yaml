apiVersion: v1
kind: Service
metadata:
  # Service headless exigido pelo StatefulSet (dá nome DNS estável a cada pod)
  name: io-bound-headless
  labels:
    app.kubernetes.io/name: io-bound
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: io-bound
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: io-bound
  labels:
    app.kubernetes.io/name: io-bound
spec:
  serviceName: io-bound-headless
  # Uma réplica: cada uma teria seu próprio volume, e um arquivo criado em um pod
  # não existiria nos outros
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: io-bound
  template:
    metadata:
      labels:
        app.kubernetes.io/name: io-bound
    spec:
      containers:
        - name: io-bound
          image: lennercp/io-bound:1.0.0
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # A aplicação não tem rota de health
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: io-bound
  labels:
    app.kubernetes.io/name: io-bound
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: io-bound
  ports:
    - name: http
      port: 8080
      targetPort: http
      # Publicada na VM pelo `minikube start --ports`; o Load Balancer aponta para ela
      nodePort: 30082
